name: SRE Log Analyzer CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python Script
        run: python -m py_compile analyzer.py

      - name: Generate HTML Report
        run: python analyzer.py

      - name: Verify Generated Files
        run: |
          test -f report.html
          test -f dashboard.html
