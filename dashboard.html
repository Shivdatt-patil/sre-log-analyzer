<!DOCTYPE html>
<html>
<head>
    <title>SRE Dashboard</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 10px;
            border-radius: 8px;
            width: 200px;
        }
    </style>
</head>
<body>

<h1>SRE Monitoring Dashboard</h1>

<div class="card">
    <h3>Total Logs</h3>
    <p>150</p>
</div>

<div class="card">
    <h3>Errors</h3>
    <p>10</p>
</div>

<div class="card">
    <h3>Warnings</h3>
    <p>20</p>
</div>

</body>
</html>
