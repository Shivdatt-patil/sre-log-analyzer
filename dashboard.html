<!DOCTYPE html>
<html>
<head>
    <title>SRE Dashboard</title>

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 220px;
            text-align: center;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .total {
            border-left: 5px solid dodgerblue;
        }

        .errors {
            border-left: 5px solid red;
        }

        .warnings {
            border-left: 5px solid orange;
        }

        .info {
            border-left: 5px solid green;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>SRE Monitoring Dashboard</h1>

<div class="container">

    <div class="card total">
        <h3>Total Logs</h3>
        <p class="number">150</p>
    </div>

    <div class="card errors">
        <h3>Errors</h3>
        <p class="number">10</p>
    </div>

    <div class="card warnings">
        <h3>Warnings</h3>
        <p class="number">20</p>
    </div>

    <div class="card info">
        <h3>Info Logs</h3>
        <p class="number">120</p>
    </div>

</div>

<h2>Top Errors</h2>

<ul>
    <li>Database Connection Failed : 3</li>
    <li>API Timeout : 2</li>
</ul>

</body>
</html>
